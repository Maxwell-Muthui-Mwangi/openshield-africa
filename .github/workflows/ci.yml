name: Validate OpenShield
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openshield
          POSTGRES_PASSWORD: ci_only_secret
          POSTGRES_DB: openshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openshield -d openshield_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openshield:ci_only_secret@127.0.0.1:5432/openshield_test
      INTEGRATION_DATABASE_URL: postgresql://openshield:ci_only_secret@127.0.0.1:5432/openshield_test
      DB_MODE: self-hosted
      DATABASE_SSL: disable
      APP_ORIGIN: http://localhost:5173
      REGISTRATION_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Apply schema to ephemeral test database
        run: npm run db:migrate
      - name: Run isolated real-PostgreSQL API integration tests
        run: npm run test:integration
